name: be_flutter
description: Gestionnaire d'expériences professionnelles - Conversion de Qt/C++ vers Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Data Persistence
  shared_preferences: ^2.2.3

  # JSON Serialization
  json_annotation: ^4.9.0

  # Date formatting
  intl: ^0.19.0
  google_fonts: ^7.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
